<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title> Kourt's</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Importa o CSS do Bootstrap via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="main.css">
</head>
<body>

  <!-- Barra de Navegação -->
  <nav class="navbar sticky-top" id="nav">
    <div class="container-fluid d-flex align-items-center gap-3 px-3">

      <!-- Clique na marca volta para "todos" -->
      <a class="navbar-brand flex-shrink-0" href="#" onclick="navegar('tela-home')"> <img src="imagens/logoKourtss.png" style="height: 46px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255, 255, 255,0.15);"></a>

      <!-- Barra de pesquisa e filtro --> 
      <div class="search-wrapper flex-grow-1 position-relative">
          <i class="bi bi-search search-icon"></i>
          <input type="text" id="inputPesquisa" placeholder="Pesquise por um nome ou esporte" class="search-input">
      </div>   
      
    <!-- Links visíveis só no desktop -->
    <div class="nav-desktop d-none d-lg-flex gap-2">
      <button class="btn btn-nav" onclick="navegar('tela-home')">
        <i class="bi bi-house me-1"></i> Início
      </button>
      <button class="btn btn-nav" onclick="navegar('tela-reservas')">
        <i class="bi bi-calendar me-1"></i> Minhas Reservas
      </button>
      <button class="btn btn-nav" onclick="navegar('tela-user')">
        <i class="bi bi-person me-1"></i> Meu Perfil
      </button>
    </div>

  </div>  
       
  </nav>
 
  <!-- Conteúdo principal -->
  <div class="container py-4">
    

    <!-- Tela principal com lista de quadras - COMPLETO  -->
    <div id="tela-home" class="tela row row-cols-1 row-cols-md-2 g-3  row-cols-lg-3 g-3 show"></div>
      
   <!-- Mostrar os Detalhes da quadra -->
  <div id="modal-detalhes" class="collapse"></div>

  <!-- Selecionar agendamento, dia, horario etc -->
  <div id="modal-agendamento" class="collapse"></div>


  <!-- Tela Minhas Reservas -->
  <div id="tela-reservas" class="tela collapse"> 
     <div class="reservas-header d-flex justify-content-between align-items-center mb-3">
       <h2 class="reservas-titulo"> Minhas Reservas </h2>
     </div>

     <div id="lista-reservas" class="reservas-lista">
       <!-- As Reservas são inseridas aqui por meio do JS-->
     </div>
  </div> 




    <!-- Tela Meu Perfil -->
  <div id="tela-user" class="tela collapse">
      <div class="perfil-container">
    
    <!-- Card do avatar -->
    <div class="perfil-header" style="position: relative;">
      <button class="perfil-logout-btn" title="Sair" onclick="logout()" style="position: absolute; top: 0; right: 0; background: transparent; border: none; color: white; font-size: 2.3rem;">
        <i class="bi bi-box-arrow-left"></i>
      </button>

      <div class="perfil-avatar-wrapper">
        <img src="imagens/logoKourtss.png" alt="foto de perfil" class="perfil-avatar">
        <button class="perfil-avatar-edit" title="Alterar foto">
          <i class="bi bi-camera"></i>
        </button>
      </div>
      <h4 class="perfil-nome" id="perfil-titulo-apelido">Jogador</h4>
    </div>

    <!-- Formulário -->
    <div class="perfil-form">
      <div class="perfil-section-title">Informações Pessoais</div>
        <div class="perfil-row">
          <div class="perfil-field"> 
            <label> Apelido </label>
            <input type="text" id="perfil-apelido" placeholder="Seu">
           </div>
          </div>  

           <div class="perfil-row">
            <div class="perfil-field">
            <label>Nome</label>
            <input type="text" id="perfil-nome" placeholder="Seu nome" disabled>
          </div>
          <div class="perfil-field">
            <label>Sobrenome</label>
            <input type="text" id="perfil-sobrenome" placeholder="Seu sobrenome" disabled>
          </div>
        </div>

        <div class="perfil-row">
          <div class="perfil-field">
            <label>E-mail</label>
            <input type="email" id="perfil-email" placeholder="seu@email.com">
          </div>
          <div class="perfil-field">
            <label>Telefone</label>
            <input type="tel" id="perfil-telefone" placeholder="(48) 99999-0000" disabled>
          </div>
        </div>

        <div class="perfil-section-title" style="margin-top: 2rem;">Segurança</div>

        <div class="perfil-row">
          <div class="perfil-field">
            <label>Senha Atual</label>
              <div class="input-senha">
              <input type="password" id="perfil-senha-atual" placeholder="••••••••">
              <i class="bi bi-eye toggle-senha"></i>
            </div>
          </div>
        </div>

        <div class="perfil-row">
          <div class="perfil-field">
            <div class="input-senha">
              <label>Nova Senha</label>
              <input type="password" id="perfil-nova-senha" placeholder="••••••••">
              <i class="bi bi-eye toggle-senha"></i>
            </div>
          </div>

          <div class="perfil-field">
            <div class="input-senha">
              <label>Confirmar Nova Senha</label>
              <input type="password" id="perfil-confirmar-senha" placeholder="••••••••">
              <i class="bi bi-eye toggle-senha"></i>  
            </div>  
          </div>
        </div>

        <h6 id="perfil-erro" style="color: #ff6b6b;"></h6>
        <button class="perfil-salvar" onclick="salvarPerfil()">
          <i class="bi bi-check-lg me-2"></i> Salvar Modificações
        </button>
    </div>
  </div>

    <!-- Tela de contato -->
    <div id="tela-contato" class="tela collapse">
      <div class="card shadow p-4">
        <h2>Fale Conosco</h2>
        <p><strong>Endereço:</strong> Rua Exemplo, 123 - Centro</p>
        <p><strong>Cidade:</strong> Biguaçu - SC</p>
        <p><strong>Telefone:</strong> (48) 99999-0000</p>
        <p><strong>Email:</strong> contato@kourts.com</p>
        <button class="btn btn-secondary mt-3" onclick="voltar()">← Voltar</button>
      </div>
    </div>
 </div>   

  <!-- Modal de Login / cadastro (tentou agendar ele abre)-->
   <div id="modal-auth" class="collapse">
        <div class="modal-overlay" onclick="fecharModalAuth(event)">
            <div class="auth-card" onclick="event.stopPropagation()">

                <div class="logo">
                    <img src="imagens/logoKourtss.png" alt="logo Kourt's">
                    <span class="logo-texto"> Kourt's</span>
                </div>

                <div class="tabs" role="tablist">
                    <button class="btn" id="tab-login" onclick="mudaBt('login')">Entrar</button>
                    <button class="btn" id="tab-cadastro" onclick="mudaBt('cadastrar')">Criar Conta</button>
                </div>

                <!-- Login -->
                <div class="formulario" id="formulario-login">
                  <div class="field">
                      <label for="login-apelido">Apelido</label>
                      <input type="text" id="login-apelido" placeholder="informe seu apelido">
                  </div>
                  <div>
                    <label for="login-senha">Senha</label>
                    <input type="password" id="login-senha" placeholder="informe a senha">
                  </div>
                  <button class="btn-primary" id="submit-login" onclick="login()">
                    Entrar
                    <div class="spinner"></div>
                  </button>
                  <div class="card-footer">
                    Ainda não tem conta? <a href="#" onclick="mudaBt('cadastrar'); return false;"> Criar Conta</a>
                  </div>
                  <h5 id="error-login"></h5>
                </div>


                <!-- Cadastro -->
                <div class="formulario" id="formulario-cadastro">
                  <div class="cad-grid">

                    <div class="cad-col">
                      <div class="field">
                          <label for="">Nome</label>
                          <input type="text" id="nome" placeholder="Informe seu nome">
                      </div>
                      <div>
                        <label for="">Senha</label>
                        <input type="password" id="senha" placeholder="informe sua senha">
                      </div>
                      <div>
                        <label for="">Sobrenome</label>
                        <input type="text" id="sobrenome" placeholder="informe seu sobrenome">
                      </div>
                      <div>
                        <label for="">E-mail</label>
                        <input type="email" id="email" placeholder="seu@email.com">
                      </div>
                      <div>
                        <label for="">CPF</label>
                        <input type="text" id="cpf" value="___.___.___-__" maxlength="14" placeholder="informe seu CPF">
                      </div>
                      <div>
                        <label for="">Telefone</label>
                        <input type="tel" id="telefone" value="(__) _____-____" maxlength="14" placeholder="informe seu telefone">
                      </div>
                      <div>
                        <label for="">Apelido</label>
                        <input type="text" id="apelido" placeholder="Informe seu apelido">
                      </div>
                    </div>

                    <div class="cad-col">
                        <div class="field">
                            <label class="label-secao">Local</label>
                            <label for="estado">Estado</label>
                            <input type="text" id="estado" placeholder="Informe seu Estado">
                        </div>
                        <div class="field">
                          <label for="cidade">Cidade</label>
                          <input type="text" id="cidade" placeholder="Informe sua cidade">
                        </div>
                    </div>

                    <h5 id="error-cadastro"></h5>
                  </div>

                   <button class="btn-primary" id="submit-cadastro" onclick="criarJogador()">
                      Criar Conta
                      <div class="spinner"></div>
                   </button>
                   <div class="card-footer">
                    Já tem conta? <a href="#" onclick="mudaBt('login'); return false;"> Entrar</a>
                   </div>
                </div>
              </div>
             </div>
            </div>  

    <!-- Footer com os botões -->
     <div class="btn-group fixed-bottom container-fluid" id="footer" style="background-color: #2A612C; height: 3rem;"  role="group" aria-label="Basic example">
        <button type="button" class="btn"  style="background-color: #2A612C; color: white;"  onclick="navegar('tela-home')">
        <i class="bi bi-house" style="font-size: 1.5rem"></i>
        </button>
      
        <button type="button"  class="btn "  style="background-color: #2A612C; color: white;" onclick="navegar('tela-reservas')">
        <i class="bi bi-calendar" style="font-size: 1.5rem"></i>
        </button>

        <button type="button"  class="btn "  style="background-color: #2A612C; color: white;"  onclick="navegar('tela-user')">
        <i class="bi bi-person" style="font-size: 1.5rem"></i>
        </button>

     </div>
    </div> 
     

  <!-- JavaScript do Bootstrap via CDN -->
   <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
