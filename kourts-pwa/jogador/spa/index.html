<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title> Kourt's</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Importa o CSS do Bootstrap via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="main.css">
</head>
<body>

  <!-- Barra de Navegação -->
  <nav class="navbar sticky-top" id="nav">
    <div class="container-fluid d-flex align-items-center gap-3 px-3">

      <!-- Clique na marca volta para "todos" -->
      <a class="navbar-brand flex-shrink-0" href="#" onclick="navegar('tela-home')"> <img src="imagens/logoKourtss.png" style="height: 46px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255, 255, 255,0.15);"></a>

      <!-- Barra de pesquisa e filtro --> 
      <div class="search-wrapper flex-grow-1 position-relative">
          <i class="bi bi-search search-icon"></i>
          <input type="text" id="inputPesquisa" placeholder="Pesquise por um nome ou esporte" class="search-input">
      </div>    
       
  </nav>
 
  <!-- Conteúdo principal -->
  <div class="container py-4">
    

    <!-- Tela principal com lista de produtos - COMPLETO  -->
    <div id="tela-home" class="tela row row-cols-1 row-cols-md-2 g-3 show"></div>
      
   <!-- Mostrar os Detalhes da quadra -->
  <div id="modal-detalhes" class="collapse"></div>

  <!-- Selecionar agendamento, dia, horario etc -->
  <div id="modal-agendamento" class="collapse"></div>

    <!-- Tela Detalhes Usuário -->
     <div id="tela-user" class="tela row row-cols-1 row-cols-md-3 g-3 collapse">
      <h5> Meu Perfil</h5>
        <span class="card h-100">
          <img src="imagens/logoKourtss.png" style="height: 33%; width: 33%; margin: auto; border-radius: 55%; margin-top: 5%;" alt="foto de perfil">
          <label> Nome: </label>
          <input type="text" name="nome" placeholder="nome">
          <label> Sobrenome: </label>
          <input type="text" name="sobrenome" placeholder="sobrenome">
          <label> Email: </label>
          <input type="text" name="email" placeholder="e-mail">
          <label> Telefone: </label>
          <input type="tel" name="telefone" placeholder="telefone">
          <label> Senha Atual: </label>
          <input type="password" name="senhaAtual" placeholder="senha atual">
          <label> Nova senha: </label>
          <input type="password" name="novaSenha" placeholder="nova senha">
          <label> Confirmar senha: </label>
          <input type="password" name="confirmarSenha" placeholder="confirmar nova senha"> <br>
          <button type="button" style="margin-bottom: 5%;"> Salvar Modificações</button>
        </span>
     </div>

    <!-- Tela de contato -->
    <div id="tela-contato" class="tela collapse">
      <div class="card shadow p-4">
        <h2>Fale Conosco</h2>
        <p><strong>Endereço:</strong> Rua Exemplo, 123 - Centro</p>
        <p><strong>Cidade:</strong> Biguaçu - SC</p>
        <p><strong>Telefone:</strong> (48) 99999-0000</p>
        <p><strong>Email:</strong> contato@kourts.com</p>
        <button class="btn btn-secondary mt-3" onclick="voltar()">← Voltar</button>
      </div>
    </div>

    <!-- Footer com os botões -->
     <div class="btn-group fixed-bottom container-fluid" style="background-color: #2A612C; height: 3rem;"  role="group" aria-label="Basic example">
        <button type="button" class="btn"  style="background-color: #2A612C; color: white;"  onclick="navegar('tela-home')">
        <i class="bi bi-house" style="font-size: 1.5rem"></i>
        </button>
      
        <button type="button"  class="btn "  style="background-color: #2A612C; color: white;">
        <i class="bi bi-calendar" style="font-size: 1.5rem"></i>
        </button>

        <button type="button"  class="btn "  style="background-color: #2A612C; color: white;"  onclick="navegar('tela-user')">
        <i class="bi bi-person" style="font-size: 1.5rem"></i>
        </button>

     </div>

  <!-- JavaScript do Bootstrap via CDN -->
   <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
