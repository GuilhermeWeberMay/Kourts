<!DOCTYPE html>
<html lang='pt-BR'>
<head>
 <meta charset='utf-8'>
 <meta name='viewport' content='width=device-width, initial-scale=1'>
 <title> Kourt's </title>

  <!-- Importa o CSS do Bootstrap via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="main.css">
</head>
<body>

  <div class="card" role="main">

   <div class="logo">
      <img src="../jogador/spa/imagens/logoKourtss.png" alt="logo Kourt's">
      <span class="logo-texto"> Kourt's</span>
   </div>

   <div class="tabs" role="tablist">
      <button class="btn" id="btn-login" onclick="mudaBt('login')">Entrar</button>
      <button class="btn" id="btn-cadastro" onclick="mudaBt('cadastrar')">Criar Conta</button>
   </div>

   <!-- Login -->
    <div class="formulario" id="formulario-login">
       <div class="field">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" placeholder="seu@email.com">
       </div>
       <div>
         <label for="login-senha">Senha</label>
         <input type="password" id="login-senha" placeholder="informe a senha">
       </div>
       <button class="btn-primary" id="btn-login" onclick="handleLogin()">
         Entrar
         <div class="spinner"></div>
       </button>
       <div class="card-footer">
         Ainda não tem conta? <a href="#" onclick="mudaBt('cadastrar'); return false;"> Criar Conta</a>
       </div>
    </div>

    <!-- Cadastro -->
     <div class="formulario" id="formulario-cadastro">
       <div class="field">
          <label for="">Nome</label>
          <input type="text" id="cad-nome" placeholder="Informe seu nome">
       </div>
       <div>
         <label for="">Senha</label>
         <input type="password" id="cad-senha" placeholder="informe sua senha">
       </div>
       <div>
         <label for="">Sobrenome</label>
         <input type="text" id="cad-sobrenome" placeholder="informe seu sobrenome">
       </div>
       <div>
         <label for="">E-mail</label>
         <input type="email" id="cad-email" placeholder="seu@email.com">
       </div>
       <div>
         <label for="">CPF</label>
         <input type="text" id="cad-cpf" placeholder="informe seu CPF">
       </div>
       <div>
         <label for="">Telefone</label>
         <input type="tel" id="cad-tel" placeholder="informe seu telefone">
       </div>
       <div>
         <label for="">Apelido</label>
         <input type="text" id="cad-apelido" placeholder="Informe seu apelido">
       </div>
       <div>
         <label> Local </label>
           <label for=""> Bairro</label>
            <input type="text" id="cad-bairro" placeholder="Informe seu bairro">
       </div>   
       <div>  
           <label for=""> Estado</label>
            <input type="text" id="cad-estado" placeholder="Informe seu Estado"> 
       </div>
       <div>
           <label for=""> Cidade</label>
            <input type="text" id="cad-cidade" placeholder="Informe sua cidade"> 
       </div>
       <button class="btn-primary" id="btn-cadastro" onclick="handleCadastro()">
         Criar Conta
         <div class="spinner"></div>
       </button>
       <div class="card-footer">
         Já tem conta? <a href="#" onclick="mudaBt('login'); return false;">Entrar</a>
       </div>
     </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
 
</body>
</html>
