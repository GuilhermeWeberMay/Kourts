<!DOCTYPE html>
<html lang='pt-BR'>
<head>
 <meta charset='utf-8'>
 <meta name='viewport' content='width=device-width, initial-scale=1'>
 <title> Kourt's </title>

  <!-- Importa o CSS do Bootstrap via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="main.css">
</head>
<body>

  <div class="card" role="main">

   <div class="logo">
      <img src="../jogador/spa/imagens/logoKourtss.png" alt="logo Kourt's">
      <span class="logo-texto"> Kourt's</span>
   </div>

   <div class="tabs" role="tablist">
      <button class="btn" id="btn-login" onclick="mudaBt('login')">Entrar</button>
      <button class="btn" id="btn-cadastro" onclick="mudaBt('cadastrar')">Criar Conta</button>
   </div>

   <!-- Login -->
    <div class="formulario" id="formulario-login">
       <div class="field">
          <label for="login-email">Apelido</label>
          <input type="email" id="login-apelido" placeholder="informe seu apelido">
       </div>
       <div>
         <label for="login-senha">Senha</label>
         <input type="password" id="login-senha" placeholder="informe a senha">
       </div>
       <button class="btn-primary" id="btn-login" onclick="Login()">
         Entrar
         <div class="spinner"></div>
       </button>
       <div class="card-footer">
         Ainda não tem conta? <a href="#" onclick="mudaBt('cadastrar'); return false;"> Criar Conta</a>
       </div>
    </div>


    <!-- Cadastro -->
     <div class="formulario" id="formulario-cadastro">
      <div class="cad-grid">

        <div class="cad-col">
          <div class="field">
              <label for="">Nome</label>
              <input type="text" id="nome" placeholder="Informe seu nome">
          </div>
          <div>
            <label for="">Senha</label>
            <input type="password" id="senha" placeholder="informe sua senha">
          </div>
          <div>
            <label for="">Sobrenome</label>
            <input type="text" id="sobrenome" placeholder="informe seu sobrenome">
          </div>
          <div>
            <label for="">E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com">
          </div>
          <div>
            <label for="">CPF</label>
            <input type="text" id="cpf" value="___.___.___-__" maxlength="14" placeholder="informe seu CPF">
          </div>
          <div>
            <label for="">Telefone</label>
            <input type="tel" id="telefone" value="(__) _____-____" maxlength="14" placeholder="informe seu telefone">
          </div>
          <div>
            <label for="">Apelido</label>
            <input type="text" id="apelido" placeholder="Informe seu apelido">
          </div>
        </div>
         

      <div class="cad-col">
          <div class="field">
            <label class="local-header">Local</label>
            <label>Estado</label>
            <input type="text" id="estado" placeholder="Informe seu Estado">
          </div>
          <div class="field">
            <label>Cidade</label>
            <input type="text" id="cidade" placeholder="Informe sua cidade">
          </div>
    </div>

        <h5 id="error"></h5>  
        <button onclick="mostrarToken()"> O </button>

   </div> 


       <button class="btn-primary" id="btn-cadastro" onclick="criarJogador()">
         Criar Conta
         <div class="spinner"></div>
       </button>
       <div class="card-footer">
         Já tem conta? <a href="#" onclick="mudaBt('login'); return false;">Entrar</a>
       </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
 
</body>
</html>
