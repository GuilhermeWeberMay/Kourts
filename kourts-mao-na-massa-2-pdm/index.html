<!DOCTYPE html>
<html lang="pt-BR">

<!--
Execute no terminal na pasta raiz este comando para rodar o json server: 
  npx json-server db.json

obs: ter nodejs instalado no seu dispositivo, e posteriormente executar este comando no terminal na pasta raiz: 
  npm install json-server
-->

<head>
  <meta charset="UTF-8">
  <title> Kourt's</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Importa o CSS do Bootstrap via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="main.css">

  <!-- manifest para instalação do pwa -->
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <!-- Barra de Navegação -->
  <nav class="navbar sticky-top" id="nav">
    <div class="container-fluid d-flex align-items-center gap-3 px-3">

      <!-- Clique na marca volta para "todos" -->
      <a class="navbar-brand flex-shrink-0" href="#" onclick="navegar('tela-home')"> <img src="imagens/logo-kourts.png"
          style="height: 46px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255, 255, 255,0.15);"></a>

      <!-- Barra de pesquisa e filtro -->
      <div class="search-wrapper flex-grow-1 position-relative">
        <i class="bi bi-search search-icon"></i>
        <input type="text" id="inputPesquisa" placeholder="Pesquise por um nome ou esporte" class="search-input">
      </div>

      <!-- Links visíveis só no desktop -->
      <div class="nav-desktop d-none d-lg-flex gap-2">
        <button id="installAppBt1" class="btn btn-nav collapse" onclick="installApp()">
          Instalar App
        </button>
        <button class="btn btn-nav" onclick="navegar('tela-home')">
          <i class="bi bi-house me-1"></i> Início
        </button>
        <button class="btn btn-nav" onclick="navegar('tela-reservas')">
          <i class="bi bi-calendar me-1"></i> Minhas Reservas
        </button>
        <button class="btn btn-nav" onclick="navegar('tela-user')">
          <i class="bi bi-person me-1"></i> Meu Perfil
        </button>
      </div>
    </div>
  </nav>

  <!-- Conteúdo principal -->
  <div class="container py-4">
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 99999;">
      <div id="reserva-alerta" class="toast align-items-center text-bg-success border-0" role="alert"
        aria-live="assertive" aria-atomic="true" data-bs-autohide="false">
        <div class="d-flex">
          <div class="toast-body">
            agendamento realizado com sucesso!
          </div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
            aria-label="Close"></button>
        </div>
      </div>
    </div>

    <!-- Tela principal com lista de produtos - COMPLETO  -->
    <div id="tela-home" class="tela row row-cols-1 row-cols-md-2 g-3  row-cols-lg-3 g-3 show">
    </div>

    <!-- Mostrar os Detalhes da quadra -->
    <div id="modal-detalhes" class="collapse"></div>

    <!-- Selecionar agendamento, dia, horario etc -->
    <div id="modal-agendamento" class="collapse"></div>

    <!-- Tela Meu Perfil -->
    <div id="tela-user" class="tela collapse">
      <div class="perfil-container">

        <button id="installAppBt2" class="btn btn-nav d-lg-none collapse" onclick="installApp()">
          Instalar App
        </button>

        <!-- Card do avatar -->
        <div class="perfil-header">
          <div class="perfil-avatar-wrapper">
            <img src="imagens/logo-kourts.png" alt="foto de perfil" class="perfil-avatar">
            <button class="perfil-avatar-edit" title="Alterar foto">
              <i class="bi bi-camera"></i>
            </button>
          </div>
          <h4 class="perfil-nome">Jogador</h4>
        </div>

        <!-- Formulário -->
        <div class="perfil-form">
          <div class="perfil-section-title">Informações Pessoais</div>
          <div class="perfil-row">
            <div class="perfil-field">
              <label for="nome">Nome</label>
              <input type="text" id="nome" name="nome" placeholder="Seu nome">
            </div>
            <div class="perfil-field">
              <label for="sobrenome">Sobrenome</label>
              <input type="text" id="sobrenome" name="sobrenome" placeholder="Seu sobrenome">
            </div>
          </div>

          <div class="perfil-row">
            <div class="perfil-field">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" placeholder="seu@email.com">
            </div>
            <div class="perfil-field">
              <label for="telefone">Telefone</label>
              <input type="tel" id="telefone" name="telefone" placeholder="(48) 99999-0000">
            </div>
          </div>

          <div class="perfil-section-title" style="margin-top: 2rem;">Segurança</div>

          <div class="perfil-row">
            <div class="perfil-field">
              <label for="senha-atual">Senha Atual</label>
              <div class="input-senha">
                <input type="password" id="senha-atual" name="senha-atual" placeholder="••••••••">
                <i class="bi bi-eye toggle-senha"></i>
              </div>
            </div>
          </div>

          <div class="perfil-row">
            <div class="perfil-field">
              <div class="input-senha">
                <label for="nova-senha">Nova Senha</label>
                <input type="password" id="nova-senha" name="nova-senha" placeholder="••••••••">
                <i class="bi bi-eye toggle-senha"></i>
              </div>
            </div>

            <div class="perfil-field">
              <div class="input-senha">
                <label for="confirmar-senha">Confirmar Nova Senha</label>
                <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="••••••••">
                <i class="bi bi-eye toggle-senha"></i>
              </div>
            </div>
          </div>

          <button class="perfil-salvar">
            <i class="bi bi-check-lg me-2"></i> Salvar Modificações
          </button>
        </div>
      </div>

      <!-- Tela de contato -->
      <div id="tela-contato" class="tela collapse">
        <div class="card shadow p-4">
          <h2>Fale Conosco</h2>
          <p><strong>Endereço:</strong> Rua Exemplo, 123 - Centro</p>
          <p><strong>Cidade:</strong> Biguaçu - SC</p>
          <p><strong>Telefone:</strong> (48) 99999-0000</p>
          <p><strong>Email:</strong> contato@kourts.com</p>
          <button class="btn btn-secondary mt-3" onclick="voltar()">← Voltar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Tela de Reservas  -->
  <div id="tela-reservas" class="tela row row-cols-1 row-cols-md-2 g-3  row-cols-lg-3 g-3 collapse">

  </div>

  <!-- Footer com os botões -->
  <div class="btn-group fixed-bottom container-fluid" id="footer" style="background-color: #2A612C; height: 3rem;"
    role="group" aria-label="Basic example">
    <button type="button" class="btn" style="background-color: #2A612C; color: white;" onclick="navegar('tela-home')">
      <i class="bi bi-house" style="font-size: 1.5rem"></i>
    </button>

    <button type="button" class="btn " style="background-color: #2A612C; color: white;"
      onclick="navegar('tela-reservas')">
      <i class="bi bi-calendar" style="font-size: 1.5rem"></i>
    </button>

    <button type="button" class="btn " style="background-color: #2A612C; color: white;" onclick="navegar('tela-user')">
      <i class="bi bi-person" style="font-size: 1.5rem"></i>
    </button>

  </div>


  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100">
    <div id="reserva-alerta" class="toast align-items-center border-0" role="alert" aria-live="assertive"
      aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body fw-bold text-white">
          Mensagem padrão
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
          aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- JavaScript do Bootstrap via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
